# 發佈新版本（GitHub Releases）時，自動打包 Apple 晶片與 Intel 兩種版本的 Meowmentum.app
name: Build app

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: apple-silicon
          - os: macos-15-intel
            arch: intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pillow
          pyinstaller --noconfirm --clean --log-level WARN Meowmentum.spec
          codesign --force --deep --sign - dist/Meowmentum.app
          ditto -c -k --keepParent dist/Meowmentum.app "Meowmentum-${{ matrix.arch }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: Meowmentum-${{ matrix.arch }}
          path: Meowmentum-${{ matrix.arch }}.zip

      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "Meowmentum-${{ matrix.arch }}.zip" --clobber
